apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kandamma-ingress
  namespace: kandamma-prod
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  tls:
  - hosts:
    - store.kandammakids.com
    secretName: kandamma-tls-cert
  rules:
  - host: store.kandammakids.com
    http:
      paths:
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: kandamma-backend-service
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kandamma-frontend-service
            port:
              number: 3000
