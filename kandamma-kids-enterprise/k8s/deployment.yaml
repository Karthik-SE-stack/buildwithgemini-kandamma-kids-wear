apiVersion: apps/v1
kind: Deployment
metadata:
  name: kandamma-backend-deployment
  namespace: kandamma-prod
  labels:
    app: kandamma-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kandamma-backend
  template:
    metadata:
      labels:
        app: kandamma-backend
    spec:
      containers:
      - name: backend
        image: kandamma-backend:1.0.0-RELEASE
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            secretKeyRef:
              name: kandamma-secrets
              key: db-url
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1024Mi"
            cpu: "1000m"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: kandamma-backend-service
  namespace: kandamma-prod
spec:
  selector:
    app: kandamma-backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
